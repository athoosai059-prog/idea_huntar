<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>API Test</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #1a1a2e; color: #eee; }
        .result { background: #16213e; padding: 15px; margin: 10px 0; border-radius: 5px; }
        .success { color: #10b981; }
        .error { color: #ef4444; }
        .loading { color: #f59e0b; }
        button { background: #8b5cf6; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; margin: 5px; }
    </style>
</head>
<body>
    <h1>🧪 IdeaHunter API Test</h1>
    <button onclick="testAll()">Run All Tests</button>
    <button onclick="window.location.href='http://localhost:5050/'">Open Dashboard</button>

    <div id="results">
        <p class="loading">Click "Run All Tests" to begin...</p>
    </div>

    <script>
        const API_BASE = 'http://localhost:5050';

        function addResult(message, type) {
            const results = document.getElementById('results');
            const div = document.createElement('div');
            div.className = `result ${type}`;
            div.innerHTML = message;
            results.appendChild(div);
        }

        async function testAll() {
            document.getElementById('results').innerHTML = '';
            addResult('Starting tests...', 'loading');

            // Test 1: Health Check
            try {
                const response = await fetch(`${API_BASE}/api/health`);
                const data = await response.json();
                addResult(`✅ Health Check: ${data.status} - ${data.message}`, 'success');
            } catch (error) {
                addResult(`❌ Health Check Failed: ${error.message}`, 'error');
            }

            // Test 2: Ideas API
            try {
                const response = await fetch(`${API_BASE}/api/ideas`);
                const ideas = await response.json();
                addResult(`✅ Ideas API: Loaded ${ideas.length} ideas`, 'success');
                if (ideas.length > 0) {
                    addResult(`   First idea: ${ideas[0].name} (Score: ${ideas[0].score_overall})`, 'success');
                }
            } catch (error) {
                addResult(`❌ Ideas API Failed: ${error.message}`, 'error');
            }

            // Test 3: Stats API
            try {
                const response = await fetch(`${API_BASE}/api/stats`);
                const stats = await response.json();
                addResult(`✅ Stats API: Total ${stats.total}, High Score ${stats.high_score}`, 'success');
            } catch (error) {
                addResult(`❌ Stats API Failed: ${error.message}`, 'error');
            }

            addResult('🎉 All tests completed!', 'success');
        }

        // Auto-test on load
        window.onload = function() {
            addResult('✅ JavaScript is working!', 'success');
            addResult('📡 Ready to test API endpoints...', 'loading');
        };
    </script>
</body>
</html>
