<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IdeaHunter - Working Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: #1a1a2e;
            color: #eee;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .header h1 {
            color: #8b5cf6;
            font-size: 2.5em;
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: #16213e;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            border: 1px solid #0f3460;
        }
        .stat-value {
            font-size: 2em;
            font-weight: bold;
            color: #8b5cf6;
        }
        .stat-label {
            color: #94a3b8;
            margin-top: 5px;
        }
        .ideas-section {
            background: #16213e;
            padding: 20px;
            border-radius: 10px;
            border: 1px solid #0f3460;
        }
        .ideas-section h2 {
            margin-bottom: 20px;
            color: #8b5cf6;
        }
        .idea-card {
            background: #0f3460;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 8px;
            border-left: 4px solid #8b5cf6;
        }
        .idea-name {
            font-size: 1.2em;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .idea-score {
            color: #10b981;
            font-weight: bold;
        }
        .idea-desc {
            color: #94a3b8;
            margin: 10px 0;
        }
        .idea-meta {
            font-size: 0.9em;
            color: #64748b;
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: #94a3b8;
        }
        .error {
            background: #7f1d1d;
            color: #fca5a5;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
        }
        .success {
            background: #14532d;
            color: #86efac;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
        }
        .controls {
            margin: 20px 0;
            display: flex;
            gap: 10px;
        }
        button {
            background: #8b5cf6;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background: #7c3aed;
        }
        .search-bar {
            margin: 20px 0;
        }
        .search-bar input {
            width: 100%;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #0f3460;
            background: #1a1a2e;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚀 IdeaHunter Dashboard</h1>
            <p style="color: #94a3b8;">App Idea Research Engine</p>
        </div>

        <div id="status-message"></div>

        <div class="stats">
            <div class="stat-card">
                <div class="stat-value" id="total-ideas">0</div>
                <div class="stat-label">Total Ideas</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="high-score">0</div>
                <div class="stat-label">High Score</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="saved-ideas">0</div>
                <div class="stat-label">Saved Ideas</div>
            </div>
        </div>

        <div class="controls">
            <button onclick="loadData()">🔄 Refresh Data</button>
            <button onclick="runPipeline()">⚡ Run Pipeline</button>
        </div>

        <div class="search-bar">
            <input type="text" id="search-input" placeholder="Search ideas..." oninput="filterIdeas()">
        </div>

        <div class="ideas-section">
            <h2>💡 Discovered Ideas</h2>
            <div id="ideas-container">
                <div class="loading">Loading ideas...</div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:5050';
        let allIdeas = [];

        // Show message
        function showMessage(message, type = 'info') {
            const statusDiv = document.getElementById('status-message');
            statusDiv.innerHTML = `<div class="${type}">${message}</div>`;
            setTimeout(() => {
                statusDiv.innerHTML = '';
            }, 5000);
        }

        // Load data
        async function loadData() {
            showMessage('Loading data...', 'info');

            try {
                // Load stats
                const statsResponse = await fetch(`${API_BASE}/api/stats`);
                const stats = await statsResponse.json();

                document.getElementById('total-ideas').textContent = stats.total || 0;
                document.getElementById('high-score').textContent = stats.high_score || 0;
                document.getElementById('saved-ideas').textContent = stats.saved || 0;

                // Load ideas
                const ideasResponse = await fetch(`${API_BASE}/api/ideas`);
                allIdeas = await ideasResponse.json();

                renderIdeas(allIdeas);
                showMessage(`Loaded ${allIdeas.length} ideas successfully!`, 'success');

            } catch (error) {
                console.error('Error loading data:', error);
                showMessage(`Error: ${error.message}`, 'error');
                document.getElementById('ideas-container').innerHTML = `
                    <div class="error">
                        Failed to load data. Make sure the server is running on port 5000.
                        <br><br>
                        Error: ${error.message}
                    </div>
                `;
            }
        }

        // Render ideas
        function renderIdeas(ideas) {
            const container = document.getElementById('ideas-container');

            if (!ideas || ideas.length === 0) {
                container.innerHTML = '<div class="loading">No ideas found. Run the pipeline to discover some!</div>';
                return;
            }

            container.innerHTML = ideas.map(idea => `
                <div class="idea-card">
                    <div class="idea-name">${idea.name}</div>
                    <div class="idea-score">Score: ${idea.score_overall}/10</div>
                    <div class="idea-desc">${idea.description}</div>
                    <div class="idea-meta">
                        Source: ${idea.source} | Created: ${new Date(idea.created_at).toLocaleDateString()}
                    </div>
                </div>
            `).join('');
        }

        // Filter ideas
        function filterIdeas() {
            const query = document.getElementById('search-input').value.toLowerCase();
            const filtered = allIdeas.filter(idea =>
                idea.name.toLowerCase().includes(query) ||
                idea.description.toLowerCase().includes(query)
            );
            renderIdeas(filtered);
        }

        // Run pipeline
        async function runPipeline() {
            try {
                showMessage('Starting pipeline...', 'info');
                const response = await fetch(`${API_BASE}/api/run`, { method: 'POST' });
                const data = await response.json();

                if (data.started) {
                    showMessage('Pipeline started! Refresh in a few minutes.', 'success');
                    setTimeout(loadData, 10000); // Refresh after 10 seconds
                } else {
                    showMessage('Failed to start pipeline', 'error');
                }
            } catch (error) {
                showMessage(`Error: ${error.message}`, 'error');
            }
        }

        // Load data on page load
        window.onload = function() {
            console.log('Page loaded, starting data load...');
            loadData();
        };
    </script>
</body>
</html>
