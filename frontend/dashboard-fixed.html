<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IdeaHunter Dashboard - Fixed</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #050505;
            --bg-alt: #0a0a0c;
            --surface: rgba(18, 18, 23, 0.7);
            --surface-hover: rgba(26, 26, 32, 0.9);
            --surface-border: rgba(255, 255, 255, 0.08);
            --text: #ffffff;
            --text-muted: #94a3b8;
            --primary: #8b5cf6;
            --success: #10b981;
            --error: #f43f5e;
            --warning: #f59e0b;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            line-height: 1.5;
        }

        .app-shell {
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar */
        .sidebar {
            width: 260px;
            background: var(--bg-alt);
            border-right: 1px solid var(--surface-border);
            display: flex;
            flex-direction: column;
            height: 100vh;
            position: sticky;
            top: 0;
        }

        .sidebar-logo {
            padding: 32px 24px;
        }

        .logo-mark {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: inherit;
        }

        .logo-icon {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, var(--primary), #a855f7);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-family: 'JetBrains Mono', monospace;
        }

        .logo-text {
            font-size: 20px;
            font-weight: 700;
            background: linear-gradient(135deg, #fff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav {
            flex: 1;
            padding: 0 16px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            color: var(--text-muted);
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 4px;
        }

        .nav-item:hover {
            background: var(--surface);
            color: var(--text);
        }

        .nav-item.active {
            background: var(--surface);
            color: var(--text);
            border: 1px solid var(--surface-border);
        }

        .nav-badge {
            background: var(--surface);
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }

        /* Main Content */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 24px 32px;
            border-bottom: 1px solid var(--surface-border);
            background: var(--bg);
        }

        .topbar-title {
            font-size: 24px;
            font-weight: 700;
        }

        .topbar-subtitle {
            font-size: 14px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .topbar-right {
            display: flex;
            gap: 12px;
        }

        .btn {
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: #7c3aed;
        }

        .btn-ghost {
            background: transparent;
            color: var(--text-muted);
            border: 1px solid var(--surface-border);
        }

        .btn-ghost:hover {
            background: var(--surface);
            color: var(--text);
        }

        /* Content Area */
        .content {
            flex: 1;
            padding: 32px;
            overflow-y: auto;
        }

        .page {
            display: none;
        }

        .page.active {
            display: block;
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 32px;
        }

        .stat-card {
            background: var(--surface);
            border: 1px solid var(--surface-border);
            border-radius: 12px;
            padding: 20px;
        }

        .stat-label {
            font-size: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .stat-value {
            font-size: 32px;
            font-weight: 800;
            color: white;
        }

        /* Ideas List */
        .ideas-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .idea-card {
            background: var(--surface);
            border: 1px solid var(--surface-border);
            border-radius: 12px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .idea-card:hover {
            background: var(--surface-hover);
            border-color: rgba(255, 255, 255, 0.15);
            transform: translateY(-2px);
        }

        .idea-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
        }

        .idea-name {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .idea-score {
            background: var(--surface);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 700;
        }

        .idea-score.high { color: var(--success); }
        .idea-score.medium { color: var(--warning); }
        .idea-score.low { color: var(--error); }

        .idea-desc {
            color: var(--text-muted);
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 12px;
        }

        .idea-meta {
            display: flex;
            gap: 16px;
            font-size: 12px;
            color: var(--text-muted);
        }

        .tag {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
        }

        .tag-reddit { color: #ff4500; background: rgba(255,69,0,0.1); }
        .tag-hn { color: #ff6600; background: rgba(255,102,0,0.1); }
        .tag-producthunt { color: #da552f; background: rgba(218,85,47,0.1); }

        /* Search Bar */
        .search-bar {
            background: var(--surface);
            border: 1px solid var(--surface-border);
            border-radius: 8px;
            padding: 12px 16px;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .search-input {
            flex: 1;
            background: transparent;
            border: none;
            color: white;
            font-size: 14px;
            outline: none;
        }

        .search-input::placeholder {
            color: var(--text-muted);
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        /* Loading */
        .loading {
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
        }

        .loading-spinner {
            border: 3px solid var(--surface-border);
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Status Indicator */
        .status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            font-weight: 600;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .status-dot.online {
            background: var(--success);
            box-shadow: 0 0 8px var(--success);
        }

        .status-dot.offline {
            background: var(--error);
        }
    </style>
</head>
<body>
    <div class="app-shell">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-logo">
                <a href="#" class="logo-mark">
                    <div class="logo-icon">IH</div>
                    <div class="logo-text">IdeaHunter</div>
                </a>
            </div>

            <nav class="nav">
                <div class="nav-item active" onclick="showPage('dashboard')" id="nav-dashboard">
                    📊 Dashboard
                </div>
                <div class="nav-item" onclick="showPage('ideas')" id="nav-ideas">
                    💡 Ideas <span class="nav-badge" id="ideas-badge">0</span>
                </div>
                <div class="nav-item" onclick="showPage('saved')" id="nav-saved">
                    ⭐ Saved <span class="nav-badge" id="saved-badge">0</span>
                </div>
            </nav>

            <div style="padding: 24px;">
                <div class="status">
                    <div class="status-dot online"></div>
                    <span>Connected</span>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main">
            <header class="topbar">
                <div>
                    <div class="topbar-title" id="page-title">Dashboard</div>
                    <div class="topbar-subtitle" id="page-subtitle">Overview</div>
                </div>
                <div class="topbar-right">
                    <button class="btn btn-ghost" onclick="refreshData()">↻ Refresh</button>
                    <button class="btn btn-primary" onclick="runPipeline()">⚡ Run Pipeline</button>
                </div>
            </header>

            <div class="content">
                <!-- Dashboard Page -->
                <div id="page-dashboard" class="page active">
                    <div class="stats-grid">
                        <div class="stat-card">
                            <div class="stat-label">Total Ideas</div>
                            <div class="stat-value" id="stat-total">0</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-label">High Potential</div>
                            <div class="stat-value" id="stat-high">0</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-label">Saved</div>
                            <div class="stat-value" id="stat-saved">0</div>
                        </div>
                    </div>

                    <h3 style="margin-bottom: 16px;">Top Discoveries</h3>
                    <div class="ideas-list" id="dashboard-ideas">
                        <div class="loading">
                            <div class="loading-spinner"></div>
                            <p>Loading ideas...</p>
                        </div>
                    </div>
                </div>

                <!-- Ideas Page -->
                <div id="page-ideas" class="page">
                    <div class="search-bar">
                        <span>🔍</span>
                        <input type="text" class="search-input" placeholder="Search ideas..." id="search-input" oninput="filterIdeas()">
                    </div>
                    <div class="ideas-list" id="all-ideas">
                        <div class="loading">
                            <div class="loading-spinner"></div>
                            <p>Loading ideas...</p>
                        </div>
                    </div>
                </div>

                <!-- Saved Page -->
                <div id="page-saved" class="page">
                    <div class="ideas-list" id="saved-ideas">
                        <div class="loading">
                            <div class="loading-spinner"></div>
                            <p>Loading saved ideas...</p>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        const API_BASE = 'http://localhost:5050';
        let ideas = [];
        let savedIds = new Set();
        let currentPage = 'dashboard';

        // Initialize
        async function init() {
            console.log('Initializing IdeaHunter Dashboard...');
            await Promise.all([
                loadStats(),
                loadIdeas()
            ]);
        }

        // Load Statistics
        async function loadStats() {
            try {
                const response = await fetch(`${API_BASE}/api/stats`);
                const data = await response.json();

                document.getElementById('stat-total').textContent = data.total || 0;
                document.getElementById('stat-high').textContent = data.high_score || 0;
                document.getElementById('stat-saved').textContent = data.saved || 0;
                document.getElementById('ideas-badge').textContent = data.total || 0;
                document.getElementById('saved-badge').textContent = data.saved || 0;

                console.log('Stats loaded:', data);
            } catch (error) {
                console.error('Failed to load stats:', error);
            }
        }

        // Load Ideas
        async function loadIdeas() {
            try {
                const response = await fetch(`${API_BASE}/api/ideas`);
                ideas = await response.json();

                savedIds = new Set(ideas.filter(i => i.saved).map(i => i.id));

                renderDashboard();
                renderAllIdeas();
                renderSavedIdeas();

                console.log('Ideas loaded:', ideas.length);
            } catch (error) {
                console.error('Failed to load ideas:', error);
                showError('Failed to load ideas');
            }
        }

        // Render Dashboard Ideas
        function renderDashboard() {
            const container = document.getElementById('dashboard-ideas');
            const topIdeas = [...ideas]
                .sort((a, b) => b.score_overall - a.score_overall)
                .slice(0, 5);

            if (topIdeas.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📭</div>
                        <p>No ideas found. Run the pipeline to discover some!</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = topIdeas.map(renderIdeaCard).join('');
        }

        // Render All Ideas
        function renderAllIdeas() {
            const container = document.getElementById('all-ideas');

            if (ideas.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📭</div>
                        <p>No ideas found.</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = ideas.map(renderIdeaCard).join('');
        }

        // Render Saved Ideas
        function renderSavedIdeas() {
            const container = document.getElementById('saved-ideas');
            const savedIdeas = ideas.filter(i => savedIds.has(i.id));

            if (savedIdeas.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">⭐</div>
                        <p>You haven't saved any ideas yet.</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = savedIdeas.map(renderIdeaCard).join('');
        }

        // Render Idea Card
        function renderIdeaCard(idea) {
            const scoreClass = idea.score_overall >= 7 ? 'high' :
                              idea.score_overall >= 5 ? 'medium' : 'low';

            const tagClass = idea.source === 'reddit' ? 'tag-reddit' :
                            idea.source === 'hn' ? 'tag-hn' : 'tag-producthunt';

            return `
                <div class="idea-card" onclick="viewIdea(${idea.id})">
                    <div class="idea-header">
                        <div>
                            <div class="idea-name">${idea.name}</div>
                            <div class="idea-meta">
                                <span class="tag ${tagClass}">${idea.source}</span>
                                <span>• ${new Date(idea.created_at).toLocaleDateString()}</span>
                            </div>
                        </div>
                        <div class="idea-score ${scoreClass}">${idea.score_overall}/10</div>
                    </div>
                    <div class="idea-desc">${idea.description}</div>
                </div>
            `;
        }

        // Show Page
        function showPage(page) {
            currentPage = page;

            // Update navigation
            document.querySelectorAll('.nav-item').forEach(item => {
                item.classList.remove('active');
            });
            document.getElementById(`nav-${page}`).classList.add('active');

            // Update pages
            document.querySelectorAll('.page').forEach(p => {
                p.classList.remove('active');
            });
            document.getElementById(`page-${page}`).classList.add('active');

            // Update title
            const titles = {
                dashboard: 'Dashboard',
                ideas: 'All Ideas',
                saved: 'Saved Ideas'
            };
            document.getElementById('page-title').textContent = titles[page];
            document.getElementById('page-subtitle').textContent = page.charAt(0).toUpperCase() + page.slice(1);
        }

        // Filter Ideas
        function filterIdeas() {
            const query = document.getElementById('search-input').value.toLowerCase();
            const container = document.getElementById('all-ideas');

            const filtered = ideas.filter(idea =>
                idea.name.toLowerCase().includes(query) ||
                idea.description.toLowerCase().includes(query)
            );

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">🔍</div>
                        <p>No matching ideas found.</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = filtered.map(renderIdeaCard).join('');
        }

        // View Idea
        function viewIdea(id) {
            const idea = ideas.find(i => i.id === id);
            if (idea) {
                alert(`Idea: ${idea.name}\n\nScore: ${idea.score_overall}/10\n\n${idea.description}`);
            }
        }

        // Refresh Data
        async function refreshData() {
            await Promise.all([
                loadStats(),
                loadIdeas()
            ]);
        }

        // Run Pipeline
        async function runPipeline() {
            try {
                const response = await fetch(`${API_BASE}/api/run`, { method: 'POST' });
                const data = await response.json();

                if (data.started) {
                    alert('Pipeline started successfully! Refresh in a few minutes to see new ideas.');
                    setTimeout(refreshData, 5000);
                }
            } catch (error) {
                console.error('Failed to run pipeline:', error);
                alert('Failed to start pipeline');
            }
        }

        // Show Error
        function showError(message) {
            console.error(message);
        }

        // Start the app
        window.onload = init;
    </script>
</body>
</html>
