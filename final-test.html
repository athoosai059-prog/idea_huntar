<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IdeaHunter - Final Test</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #1a1a2e; color: #eee; }
        .container { max-width: 800px; margin: 0 auto; }
        .success { color: #10b981; font-size: 1.2em; margin: 10px 0; }
        .error { color: #ef4444; font-size: 1.2em; margin: 10px 0; }
        .info { color: #3b82f6; margin: 10px 0; }
        .test-result { background: #16213e; padding: 15px; margin: 10px 0; border-radius: 5px; }
        button { background: #8b5cf6; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; margin: 5px; }
        button:hover { background: #7c3aed; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧪 IdeaHunter Final Verification Test</h1>
        <p>This test verifies that the UI is working correctly with the backend.</p>

        <div id="test-results">
            <div class="info">Running tests...</div>
        </div>

        <div style="margin-top: 20px;">
            <button onclick="window.location.href='http://localhost:5050/'">🎯 Open Main Dashboard</button>
            <button onclick="runTests()">🔄 Refresh Tests</button>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:5050';
        const results = document.getElementById('test-results');

        function addResult(message, type) {
            const div = document.createElement('div');
            div.className = `test-result ${type}`;
            div.innerHTML = message;
            results.appendChild(div);
        }

        async function runTests() {
            results.innerHTML = '<div class="info">Starting comprehensive tests...</div>';

            // Test 1: JavaScript is working
            addResult('✅ JavaScript is executing properly!', 'success');

            // Test 2: API Health Check
            try {
                const response = await fetch(`${API_BASE}/api/health`);
                const data = await response.json();
                addResult(`✅ Health Check: ${data.status} - ${data.message}`, 'success');
            } catch (error) {
                addResult(`❌ Health Check Failed: ${error.message}`, 'error');
            }

            // Test 3: Stats API
            try {
                const response = await fetch(`${API_BASE}/api/stats`);
                const stats = await response.json();
                addResult(`✅ Stats API: Total ${stats.total} ideas, High Score ${stats.high_score}`, 'success');
            } catch (error) {
                addResult(`❌ Stats API Failed: ${error.message}`, 'error');
            }

            // Test 4: Ideas API
            try {
                const response = await fetch(`${API_BASE}/api/ideas`);
                const ideas = await response.json();
                addResult(`✅ Ideas API: Loaded ${ideas.length} ideas successfully`, 'success');
                if (ideas.length > 0) {
                    addResult(`   First idea: ${ideas[0].name} (Score: ${ideas[0].score_overall})`, 'success');
                }
            } catch (error) {
                addResult(`❌ Ideas API Failed: ${error.message}`, 'error');
            }

            // Test 5: Dashboard Loading
            try {
                const response = await fetch(`${API_BASE}/`);
                const html = await response.text();

                if (html.includes('IdeaHunter')) {
                    addResult('✅ Dashboard HTML loaded successfully', 'success');
                } else {
                    addResult('❌ Dashboard HTML structure invalid', 'error');
                }
            } catch (error) {
                addResult(`❌ Dashboard Loading Failed: ${error.message}`, 'error');
            }

            addResult('🎉 All tests completed! If you see all green checkmarks, the UI is working perfectly!', 'success');
        }

        // Auto-run tests on page load
        window.onload = function() {
            setTimeout(runTests, 500);
        };
    </script>
</body>
</html>
