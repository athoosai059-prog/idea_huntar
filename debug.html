<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IdeaHunter Debug</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background: #1a1a2e;
            color: #eee;
        }
        .test-section {
            background: #16213e;
            border: 1px solid #0f3460;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .test-section h2 {
            color: #e94560;
            margin-top: 0;
        }
        .test-result {
            background: #0f3460;
            padding: 15px;
            border-radius: 4px;
            margin: 10px 0;
            font-family: monospace;
            white-space: pre-wrap;
            word-break: break-all;
        }
        .success { color: #4ade80; }
        .error { color: #f87171; }
        .warning { color: #fbbf24; }
        .info { color: #60a5fa; }
        button {
            background: #e94560;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover {
            background: #ff6b6b;
        }
        .loading {
            color: #fbbf24;
        }
    </style>
</head>
<body>
    <h1>🔧 IdeaHunter Debug Console</h1>

    <div class="test-section">
        <h2>API Endpoint Tests</h2>
        <button onclick="testHealth()">Test Health</button>
        <button onclick="testStats()">Test Stats</button>
        <button onclick="testIdeas()">Test Ideas</button>
        <button onclick="testSaved()">Test Saved Ideas</button>
        <div id="api-results"></div>
    </div>

    <div class="test-section">
        <h2>Data Analysis</h2>
        <button onclick="analyzeData()">Analyze Current Data</button>
        <div id="data-analysis"></div>
    </div>

    <div class="test-section">
        <h2>Frontend Issues</h2>
        <button onclick="checkFrontend()">Check Frontend Loading</button>
        <div id="frontend-check"></div>
    </div>

    <div class="test-section">
        <h2>Live Status</h2>
        <div id="live-status">
            <p class="info">Click buttons above to run tests...</p>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:5050';

        async function testHealth() {
            const results = document.getElementById('api-results');
            results.innerHTML = '<p class="loading">Testing health endpoint...</p>';

            try {
                const response = await fetch(`${API_BASE}/api/health`);
                const data = await response.json();

                results.innerHTML = `
                    <div class="test-result success">
✅ Health Check PASSED
Status: ${data.status}
Message: ${data.message}
                    </div>
                `;
            } catch (error) {
                results.innerHTML = `
                    <div class="test-result error">
❌ Health Check FAILED
Error: ${error.message}
                    </div>
                `;
            }
        }

        async function testStats() {
            const results = document.getElementById('api-results');
            results.innerHTML = '<p class="loading">Testing stats endpoint...</p>';

            try {
                const response = await fetch(`${API_BASE}/api/stats`);
                const data = await response.json();

                results.innerHTML = `
                    <div class="test-result success">
✅ Stats Check PASSED
Total Ideas: ${data.total}
High Score: ${data.high_score}
Saved: ${data.saved}
Last Run: ${data.last_run}

Active Scrapers:
${Object.entries(data.scrapers || {}).map(([name, info]) =>
    `  - ${name}: ${info.status} (${info.records} records, ${info.ideas} ideas)`
).join('\n')}
                    </div>
                `;
            } catch (error) {
                results.innerHTML = `
                    <div class="test-result error">
❌ Stats Check FAILED
Error: ${error.message}
                    </div>
                `;
            }
        }

        async function testIdeas() {
            const results = document.getElementById('api-results');
            results.innerHTML = '<p class="loading">Testing ideas endpoint...</p>';

            try {
                const response = await fetch(`${API_BASE}/api/ideas`);
                const ideas = await response.json();

                results.innerHTML = `
                    <div class="test-result success">
✅ Ideas Check PASSED
Total Ideas: ${ideas.length}

Sample Ideas:
${ideas.slice(0, 3).map(idea =>
    `  - ${idea.name} (Score: ${idea.score_overall}, Source: ${idea.source})`
).join('\n')}
                    </div>
                `;
            } catch (error) {
                results.innerHTML = `
                    <div class="test-result error">
❌ Ideas Check FAILED
Error: ${error.message}
                    </div>
                `;
            }
        }

        async function testSaved() {
            const results = document.getElementById('api-results');
            results.innerHTML = '<p class="loading">Testing saved ideas endpoint...</p>';

            try {
                const response = await fetch(`${API_BASE}/api/ideas/saved`);
                const data = await response.json();

                results.innerHTML = `
                    <div class="test-result success">
✅ Saved Ideas Check PASSED
Total Saved: ${data.ideas ? data.ideas.length : 0}

Saved Ideas:
${data.ideas && data.ideas.length > 0 ?
    data.ideas.map(idea =>
        `  - ${idea.name} (Score: ${idea.score_overall})`
    ).join('\n') : '  No saved ideas'}
                    </div>
                `;
            } catch (error) {
                results.innerHTML = `
                    <div class="test-result error">
❌ Saved Ideas Check FAILED
Error: ${error.message}
                    </div>
                `;
            }
        }

        async function analyzeData() {
            const analysis = document.getElementById('data-analysis');
            analysis.innerHTML = '<p class="loading">Analyzing data...</p>';

            try {
                const [ideasResponse, statsResponse] = await Promise.all([
                    fetch(`${API_BASE}/api/ideas`),
                    fetch(`${API_BASE}/api/stats`)
                ]);

                const ideas = await ideasResponse.json();
                const stats = await statsResponse.json();

                const scoreRanges = {
                    'Excellent (8.0-10.0)': ideas.filter(i => i.score_overall >= 8.0).length,
                    'Good (6.0-7.9)': ideas.filter(i => i.score_overall >= 6.0 && i.score_overall < 8.0).length,
                    'Fair (4.0-5.9)': ideas.filter(i => i.score_overall >= 4.0 && i.score_overall < 6.0).length,
                    'Poor (0.0-3.9)': ideas.filter(i => i.score_overall < 4.0).length
                };

                const sourceDistribution = {};
                ideas.forEach(idea => {
                    sourceDistribution[idea.source] = (sourceDistribution[idea.source] || 0) + 1;
                });

                analysis.innerHTML = `
                    <div class="test-result info">
📊 DATA ANALYSIS RESULTS

Total Ideas: ${ideas.length}
Saved Ideas: ${stats.saved}

Score Distribution:
${Object.entries(scoreRanges).map(([range, count]) =>
    `  ${range}: ${count} ideas`
).join('\n')}

Source Distribution:
${Object.entries(sourceDistribution).map(([source, count]) =>
    `  ${source}: ${count} ideas`
).join('\n')}

Average Score: ${(ideas.reduce((sum, i) => sum + i.score_overall, 0) / ideas.length).toFixed(2)}
                    </div>
                `;
            } catch (error) {
                analysis.innerHTML = `
                    <div class="test-result error">
❌ Data Analysis FAILED
Error: ${error.message}
                    </div>
                `;
            }
        }

        async function checkFrontend() {
            const check = document.getElementById('frontend-check');
            check.innerHTML = '<p class="loading">Checking frontend...</p>';

            try {
                // Test if main page loads
                const response = await fetch(`${API_BASE}/`);
                const html = await response.text();

                const checks = {
                    'HTML Structure': html.includes('<!DOCTYPE html>'),
                    'CSS Styles': html.includes('<style>'),
                    'JavaScript': html.includes('<script>'),
                    'API Endpoints': html.includes('/api/'),
                    'Dashboard Elements': html.includes('dashboard-ideas'),
                    'Stats Elements': html.includes('stat-total'),
                    'Navigation': html.includes('nav-ideas')
                };

                const allPassed = Object.values(checks).every(v => v);

                check.innerHTML = `
                    <div class="test-result ${allPassed ? 'success' : 'warning'}">
${allPassed ? '✅' : '⚠️'} Frontend Check Results:

${Object.entries(checks).map(([name, passed]) =>
    `${passed ? '✅' : '❌'} ${name}: ${passed ? 'PASS' : 'FAIL'}`
).join('\n')}

${allPassed ? 'All frontend components are loaded correctly!' : 'Some frontend components may be missing.'}
                    </div>
                `;
            } catch (error) {
                check.innerHTML = `
                    <div class="test-result error">
❌ Frontend Check FAILED
Error: ${error.message}
                    </div>
                `;
            }
        }

        // Auto-run health check on load
        window.onload = function() {
            document.getElementById('live-status').innerHTML = `
                <p class="success">🟢 Debug Console Ready</p>
                <p class="info">Server: ${API_BASE}</p>
                <p class="info">Time: ${new Date().toLocaleString()}</p>
            `;
        };
    </script>
</body>
</html>
