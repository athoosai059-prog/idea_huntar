<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Minimal Test</title>
</head>
<body>
    <h1>Minimal Test</h1>
    <div id="result">Testing...</div>

    <script>
        // Test 1: Basic JavaScript
        console.log('Test 1: JavaScript working');
        document.getElementById('result').innerHTML = '✅ JavaScript working<br>';

        // Test 2: Fetch API
        console.log('Test 2: Testing fetch...');
        fetch('http://localhost:5050/api/health')
            .then(response => {
                console.log('Response status:', response.status);
                return response.json();
            })
            .then(data => {
                console.log('Data:', data);
                document.getElementById('result').innerHTML += '✅ Fetch working<br>';
                document.getElementById('result').innerHTML += 'Status: ' + data.status + '<br>';
            })
            .catch(error => {
                console.error('Error:', error);
                document.getElementById('result').innerHTML += '❌ Fetch failed: ' + error.message + '<br>';
            });

        // Test 3: Ideas API
        console.log('Test 3: Testing ideas API...');
        fetch('http://localhost:5050/api/ideas')
            .then(response => response.json())
            .then(ideas => {
                console.log('Ideas:', ideas.length);
                document.getElementById('result').innerHTML += '✅ Ideas API working<br>';
                document.getElementById('result').innerHTML += 'Total ideas: ' + ideas.length + '<br>';
                if (ideas.length > 0) {
                    document.getElementById('result').innerHTML += 'First idea: ' + ideas[0].name + '<br>';
                }
            })
            .catch(error => {
                console.error('Error:', error);
                document.getElementById('result').innerHTML += '❌ Ideas API failed: ' + error.message + '<br>';
            });
    </script>
</body>
</html>
