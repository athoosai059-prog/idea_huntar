<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Test</title>
</head>
<body>
    <h1>JavaScript Test Page</h1>
    <div id="test-results">
        <p>Testing JavaScript functionality...</p>
    </div>
    <button onclick="testAPI()">Test API</button>

    <script>
        console.log('JavaScript is working!');

        function testAPI() {
            console.log('Testing API...');
            fetch('http://localhost:5050/api/health')
                .then(response => response.json())
                .then(data => {
                    console.log('API Response:', data);
                    document.getElementById('test-results').innerHTML = `
                        <p style="color: green;">✅ API Working!</p>
                        <p>Status: ${data.status}</p>
                        <p>Message: ${data.message}</p>
                    `;
                })
                .catch(error => {
                    console.error('API Error:', error);
                    document.getElementById('test-results').innerHTML = `
                        <p style="color: red;">❌ API Failed!</p>
                        <p>Error: ${error.message}</p>
                    `;
                });
        }

        // Auto-test on load
        window.onload = function() {
            console.log('Page loaded!');
            document.getElementById('test-results').innerHTML = '<p>✅ JavaScript is working! Click "Test API" to test the backend.</p>';
        };
    </script>
</body>
</html>
