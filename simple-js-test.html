<!DOCTYPE html>
<html>
<head>
    <title>Simple Test</title>
</head>
<body>
    <h1>Simple JavaScript Test</h1>
    <div id="output">Loading...</div>

    <script>
        // This should run immediately
        document.getElementById('output').innerHTML = 'JavaScript is working!';

        // Test fetch
        fetch('http://localhost:5050/api/health')
            .then(r => r.json())
            .then(data => {
                document.getElementById('output').innerHTML += '<br>API: ' + data.status;
            })
            .catch(err => {
                document.getElementById('output').innerHTML += '<br>Error: ' + err.message;
            });
    </script>
</body>
</html>
