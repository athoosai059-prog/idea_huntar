# GitLab CI/CD Pipeline for IdeaHunter

stages:
  - test
  - lint
  - security
  - build
  - deploy

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"

# Cache configuration
cache:
  paths:
    - .cache/pip
    - venv/

# Test stage
test:python39:
  stage: test
  image: python:3.9
  script:
    - python -m pip install --upgrade pip
    - pip install -r requirements.txt
    - pip install pytest pytest-cov pytest-mock pytest-timeout pytest-xdist
    - pytest tests/ -v --cov=backend --cov-report=xml --cov-report=html --cov-report=term
  coverage: '/TOTAL.*\s+(\d+%)$/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    paths:
      - htmlcov/
    expire_in: 7 days
  only:
    - branches

test:python310:
  stage: test
  image: python:3.10
  script:
    - python -m pip install --upgrade pip
    - pip install -r requirements.txt
    - pip install pytest pytest-cov pytest-mock pytest-timeout pytest-xdist
    - pytest tests/ -v --cov=backend --cov-report=term
  only:
    - branches

test:python311:
  stage: test
  image: python:3.11
  script:
    - python -m pip install --upgrade pip
    - pip install -r requirements.txt
    - pip install pytest pytest-cov pytest-mock pytest-timeout pytest-xdist
    - pytest tests/ -v --cov=backend --cov-report=term
  only:
    - branches

test:python312:
  stage: test
  image: python:3.12
  script:
    - python -m pip install --upgrade pip
    - pip install -r requirements.txt
    - pip install pytest pytest-cov pytest-mock pytest-timeout pytest-xdist
    - pytest tests/ -v --cov=backend --cov-report=term
  only:
    - branches

# Lint stage
lint:black:
  stage: lint
  image: python:3.11
  script:
    - pip install black
    - black --check backend/ tests/
  allow_failure: true

lint:isort:
  stage: lint
  image: python:3.11
  script:
    - pip install isort
    - isort --check-only backend/ tests/
  allow_failure: true

lint:flake8:
  stage: lint
  image: python:3.11
  script:
    - pip install flake8
    - flake8 backend/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
    - flake8 backend/ tests/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
  allow_failure: true

lint:mypy:
  stage: lint
  image: python:3.11
  script:
    - pip install mypy
    - mypy backend/ --ignore-missing-imports
  allow_failure: true

# Security stage
security:bandit:
  stage: security
  image: python:3.11
  script:
    - pip install bandit
    - bandit -r backend/ -f json -o bandit-report.json || true
  artifacts:
    paths:
      - bandit-report.json
    expire_in: 7 days
  allow_failure: true

security:safety:
  stage: security
  image: python:3.11
  script:
    - pip install safety
    - safety check --json > safety-report.json || true
  artifacts:
    paths:
      - safety-report.json
    expire_in: 7 days
  allow_failure: true

security:trivy:
  stage: security
  image: aquasec/trivy:latest
  script:
    - trivy fs --format json --output trivy-report.json .
    - trivy fs --severity HIGH,CRITICAL .
  artifacts:
    paths:
      - trivy-report.json
    expire_in: 7 days
  allow_failure: true

# Build stage
build:package:
  stage: build
  image: python:3.11
  script:
    - pip install build twine
    - python -m build
    - twine check dist/*
  artifacts:
    paths:
      - dist/
    expire_in: 7 days
  only:
    - main
    - develop

build:docker:
  stage: build
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  script:
    - docker build -t ideahunter:$CI_COMMIT_SHA .
    - docker tag ideahunter:$CI_COMMIT_SHA ideahunter:latest
    - docker save ideahunter:$CI_COMMIT_SHA | gzip > ideahunter.tar.gz
  artifacts:
    paths:
      - ideahunter.tar.gz
    expire_in: 7 days
  only:
    - main
    - develop

# Deploy stage
deploy:staging:
  stage: deploy
  image: python:3.11
  script:
    - echo "Deploying to staging environment..."
    # Add your deployment commands here
    # Example: kubectl apply -f k8s/staging/
  environment:
    name: staging
    url: https://staging.ideahunter.example.com
  only:
    - develop
  when: manual

deploy:production:
  stage: deploy
  image: python:3.11
  script:
    - echo "Deploying to production environment..."
    # Add your deployment commands here
    # Example: kubectl apply -f k8s/production/
  environment:
    name: production
    url: https://ideahunter.example.com
  only:
    - main
  when: manual

# Notification stage
notify:success:
  stage: deploy
  image: alpine:latest
  script:
    - echo "Pipeline completed successfully!"
    # Add notification logic here
  when: on_success
  only:
    - main
    - develop

notify:failure:
  stage: deploy
  image: alpine:latest
  script:
    - echo "Pipeline failed! Sending notification..."
    # Add notification logic here
  when: on_failure
  only:
    - main
    - develop