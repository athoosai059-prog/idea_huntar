services:
  # Web Service (API + Frontend)
  - type: web
    name: ideahunter-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 4 --timeout 120 backend.api.routes:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ideahunter-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: PRIMARY_AI
        value: groq
      - key: MIN_IDEA_SCORE
        value: "6.0"
      - key: SCRAPE_SCHEDULE
        value: "0 6 * * *"

  # Background Worker (Scheduler)
  - type: worker
    name: ideahunter-worker
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python -m backend.main
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ideahunter-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.11.0

databases:
  - name: ideahunter-db
    plan: free
