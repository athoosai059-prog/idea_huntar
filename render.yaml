services:
  # All-in-One Web Service (API + Frontend + Scheduler)
  # This stays on the 100% Free Tier
  - type: web
    name: ideahunter-app
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: ./start.sh
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ideahunter-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: LOG_TO_FILE
        value: "false"
      - key: PRIMARY_AI
        value: groq
      - key: MIN_IDEA_SCORE
        value: "6.0"

databases:
  - name: ideahunter-db
    plan: free
